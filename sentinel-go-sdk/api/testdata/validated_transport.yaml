openapi: 3.0.3
info: {title: things, version: "1"}
paths:
  /v1/thing:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [name]
                properties:
                  name: {type: string}
        "429": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
  /v1/stream:
    get:
      responses:
        "200":
          description: ok
          content:
            text/event-stream:
              schema: {type: string}
        "429": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string, maxLength: 8}
