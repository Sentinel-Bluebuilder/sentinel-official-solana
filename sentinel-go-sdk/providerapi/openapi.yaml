openapi: 3.0.3
info:
  title: Sentinel dVPN provider API
  version: "1"
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /v1/metadata:
    get:
      operationId: getMetadata
      responses:
        "200":
          description: signed metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedMessage"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /v1/tickets:
    post:
      operationId: issueTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueTicketRequest"
      responses:
        "200":
          description: ticket issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueTicketResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /v1/nodes:
    get:
      operationId: getNodes
      responses:
        "200":
          description: roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nodes"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
  /v1/plans/{plan}/nodes:
    get:
      operationId: getPlanNodes
      parameters:
        - name: plan
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PublicKey"
      responses:
        "200":
          description: roster for the plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Nodes"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: rate limited
      headers:
        Retry-After:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    PublicKey:
      type: string
      pattern: "^[1-9A-HJ-NP-Za-km-z]{32,44}$"
      x-go-type: solana.PublicKey
      x-go-type-import:
        path: github.com/solana-foundation/solana-go/v2
        name: solana
    SignedMessage:
      type: object
      additionalProperties: false
      required: [payload, signature, signer]
      properties:
        payload:
          type: object
          maxProperties: 32
        signature:
          type: string
          format: byte
          minLength: 88
          maxLength: 88
        signer:
          $ref: "#/components/schemas/PublicKey"
      x-go-type: auth.SignedMessage
      x-go-type-import:
        path: github.com/sentinel-official/sentinel-go-sdk/v3/auth
    ErrorCode:
      type: string
      enum:
        - bad_request
        - channel_node_stale
        - channel_not_open
        - client_closed_request
        - conflict
        - internal
        - invalid_subscription
        - invalid_ticket
        - invalid_voucher_signature
        - lease_not_funded
        - method_not_allowed
        - mode_not_stream
        - mode_not_voucher
        - not_found
        - peer_limit_reached
        - prepay_below_minimum
        - rate_limited
        - request_too_large
        - session_not_found
        - terms_rejected
        - unauthorized
        - voucher_exceeds_escrow
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              maxLength: 256
              pattern: '^[\x20-\x7e]*$'
      x-go-type: api.ErrorResponse
      x-go-type-import:
        path: github.com/sentinel-official/sentinel-go-sdk/v3/api
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
          x-enum-varnames: [HealthStatusOK]
        version:
          type: string
          maxLength: 64
          pattern: '^[\x20-\x7e]*$'
    APIInfo:
      type: object
      additionalProperties: false
      required: [urls, tls_sha256]
      properties:
        urls:
          type: array
          minItems: 1
          maxItems: 4
          items:
            type: string
            maxLength: 128
            pattern: '^https://[A-Za-z0-9.:\[\]-]+$'
        tls_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
    Metadata:
      type: object
      additionalProperties: false
      required: [version, program_id, provider, owner, operator, issued_at, expires_at, api, nodes, plans, sdk_version]
      properties:
        version:
          type: integer
          format: uint8
          minimum: 1
          maximum: 1
        program_id:
          $ref: "#/components/schemas/PublicKey"
        provider:
          $ref: "#/components/schemas/PublicKey"
        owner:
          $ref: "#/components/schemas/PublicKey"
        operator:
          $ref: "#/components/schemas/PublicKey"
        issued_at:
          type: integer
          format: int64
          minimum: 0
        expires_at:
          type: integer
          format: int64
          minimum: 0
        api:
          $ref: "#/components/schemas/APIInfo"
        nodes:
          type: array
          maxItems: 4096
          items:
            $ref: "#/components/schemas/PublicKey"
        plans:
          type: array
          maxItems: 1024
          items:
            $ref: "#/components/schemas/PublicKey"
        sdk_version:
          type: string
          maxLength: 64
          pattern: '^[\x20-\x7e]*$'
    RosterNode:
      type: object
      additionalProperties: false
      required: [node, live, probed_at]
      properties:
        node:
          $ref: "#/components/schemas/PublicKey"
        live:
          type: boolean
        probed_at:
          type: integer
          format: int64
          minimum: 0
        lease:
          $ref: "#/components/schemas/PublicKey"
    Nodes:
      type: object
      additionalProperties: false
      required: [nodes]
      properties:
        nodes:
          type: array
          maxItems: 4096
          items:
            $ref: "#/components/schemas/RosterNode"
    IssueTicketRequest:
      type: object
      additionalProperties: false
      required: [ticket_request]
      properties:
        ticket_request:
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
    IssueTicketResponse:
      type: object
      additionalProperties: false
      required: [ticket, expires_at, data_cap_bytes]
      properties:
        ticket:
          type: string
          maxLength: 512
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
        expires_at:
          type: integer
          format: int64
          minimum: 0
        data_cap_bytes:
          type: integer
          format: uint64
          minimum: 0
