skip_local_validator = true

[toolchain]
anchor_version = "1.2.2"
solana_version = "4.3.2"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
distributor = "SentineLDistributor111111111111111111111111"
dvpn = "SentineLDVPN1111111111111111111111111111111"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test"

[hooks]
post_build = "sh scripts/post-build.sh"
