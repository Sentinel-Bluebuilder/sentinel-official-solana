[workspace]
members = [
  "cli/ceremony",
  "crates/distributor/adr036",
  "crates/distributor/core",
  "crates/distributor/dataset",
  "crates/distributor/merkle",
  "crates/distributor/mint",
  "crates/distributor/vesting",
  "crates/dvpn/core",
  "crates/dvpn/test-support",
  "crates/test-support",
  "crates/txv1",
  "programs/distributor",
  "programs/dvpn",
  "xtask",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.95.0"

[workspace.dependencies]
anyhow = "=1.0.104"
agave-feature-set = "=4.3.2"
anchor-lang = "=1.2.2"
anchor-spl = "=1.2.2"
base64 = "=0.23.1"
bech32 = "=0.12.0"
bs58 = "=0.5.1"
bincode = "=1.3.3"
borsh = "=1.8.1"
bytemuck = "=1.25.2"
clap = "=4.6.7"
curve25519-dalek = { version = "=4.1.3", default-features = false }
ed25519-dalek = "=2.2.0"
getrandom = "=0.2.17"
hex = "=0.4.3"
k256 = { version = "=0.14.0", default-features = false }
litesvm = "=0.18.1"
num-bigint = "=0.5.1"
num-integer = "=0.1.47"
num-traits = "=0.2.19"
rayon = "=1.12.0"
ripemd = "=0.2.0"
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
solana-account = "=4.7.0"
solana-client = "=4.3.2"
solana-commitment-config = "=3.1.1"
solana-feature-gate-interface = "=4.0.0"
solana-hash = "=4.6.0"
solana-curve25519 = "=4.0.1"
solana-instruction = "=3.5.1"
solana-instruction-error = "=2.5.0"
solana-keypair = "=3.1.2"
solana-keccak-hasher = "=3.1.0"
solana-loader-v3-interface = "=8.1.1"
solana-message = "=4.6.0"
solana-program-pack = "=3.1.0"
solana-sha512-hasher = "=1.0.1"
solana-pubkey = "=4.3.0"
solana-sdk = "=4.1.0"
solana-sdk-ids = "=3.1.0"
solana-secp256k1-recover = "=3.3.1"
solana-signature = "=3.5.2"
solana-signer = "=3.0.1"
solana-system-interface = "=3.3.0"
solana-transaction = "=4.3.0"
solana-transaction-error = "=3.4.0"
spl-associated-token-account = "=8.0.0"
spl-associated-token-account-interface = "=2.0.0"
spl-token-2022-interface = "=3.1.2"
spl-token-metadata-interface = "=1.0.1"
solana-program-option = "=3.1.0"
tempfile = "=3.27.0"
tracing-subscriber = "=0.3.23"
tracing = "=0.1.44"
thiserror = { version = "=2.0.21", default-features = false }
ureq = "=3.5.0"
zeroize = "=1.9.1"
wincode = "=0.6.3"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[workspace.lints.clippy]
min_ident_chars = "deny"

[workspace.metadata.solana]
tools-version = "v1.57"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
