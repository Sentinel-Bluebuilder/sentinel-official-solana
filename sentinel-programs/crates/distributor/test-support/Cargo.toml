[package]
name = "sentinel-distributor-test-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "distributor_test_support"

[dependencies]
anchor-lang.workspace = true
bincode.workspace = true
distributor = { package = "sentinel-distributor", path = "../../../programs/distributor", features = ["no-entrypoint"] }
distributor-adr036 = { package = "sentinel-distributor-adr036", path = "../adr036" }
distributor-core = { package = "sentinel-distributor-core", path = "../core" }
distributor-merkle = { package = "sentinel-distributor-merkle", path = "../merkle" }
distributor-vesting = { package = "sentinel-distributor-vesting", path = "../vesting" }
k256 = { workspace = true, features = ["arithmetic", "ecdsa"] }
litesvm.workspace = true
sha2.workspace = true
solana-instruction-error.workspace = true
solana-loader-v3-interface = { workspace = true, features = ["serde"] }
solana-program-pack.workspace = true
solana-sdk.workspace = true
solana-sdk-ids.workspace = true
solana-system-interface = { workspace = true, features = ["bincode"] }
solana-transaction-error.workspace = true
spl-associated-token-account = { workspace = true, features = ["no-entrypoint"] }
spl-associated-token-account-interface.workspace = true
spl-token-2022-interface.workspace = true
test-support = { package = "sentinel-test-support", path = "../../test-support" }
txv1 = { package = "sentinel-txv1", path = "../../txv1" }

[lints]
workspace = true
