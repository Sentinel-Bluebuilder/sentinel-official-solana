[package]
name = "sentinel-distributor-dataset"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "distributor_dataset"

[dependencies]
hex = { workspace = true }
distributor-merkle = { package = "sentinel-distributor-merkle", path = "../merkle" }
distributor-core = { package = "sentinel-distributor-core", path = "../core" }
rayon = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
distributor-vesting = { package = "sentinel-distributor-vesting", path = "../vesting", features = ["serde"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
